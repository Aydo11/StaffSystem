# Render Blueprint. Create one service per environment (staging and production), each with its own Supabase project.
services:
  - type: web
    name: valor-wellbeing-hub
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate   # applies new db/migrations/*.sql once each; never seeds
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DEV_AUTH
        value: "false"             # the server refuses to start if this is true in production
      - key: DATABASE_URL
        sync: false                # Supabase Postgres connection string (session pooler)
      - key: DATABASE_CA
        sync: false                # Supabase CA certificate (Settings → Database → SSL). Required: production refuses to connect without it
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false                # public key, sent to browsers for sign-in only
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                # server-only: private storage and invitations
      - key: SUPABASE_JWT_SECRET
        sync: false                # optional; if blank the server verifies tokens with Supabase's JWKS
      - key: APP_URL
        sync: false                # e.g. https://hub.example.org — used in invitation emails
      - key: HELP_CONTACT
        sync: false
