# Render Blueprint: the web service plus its Postgres database (sign-in, data and uploaded files all live there).
services:
  - type: web
    name: valor-wellbeing-hub
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run migrate   # applies new db/migrations/*.sql once each; never seeds
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DEV_AUTH
        value: "false"             # the server refuses to start if this is true in production
      - key: DATABASE_URL
        fromDatabase:
          name: staffcrm-db
          property: connectionString   # internal address: stays on Render's private network
      - key: RESEND_API_KEY
        sync: false                # optional: emails invitations, resets and reminders
      - key: EMAIL_FROM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false                # optional: AI assistant
      - key: APP_URL
        sync: false                # e.g. https://hub.example.org — used in invitation emails
      - key: HELP_CONTACT
        sync: false

databases:
  - name: staffcrm-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []                # no access from the internet
